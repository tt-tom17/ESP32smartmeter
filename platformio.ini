; ─────────────────────────────────────────────────────────────────────────────
;  PlatformIO-Projekt für den ESP32 Wärme-/Stromzähler-Reader
;
;  src_dir zeigt auf den Arduino-Sketch-Ordner, damit derselbe Code sowohl in der
;  Arduino-IDE als auch in PlatformIO (VSCode) gebaut werden kann.
;  WLAN wird beim Erststart über das Setup-Portal (offener AP "Zaehler-Setup")
;  eingerichtet und im NVS gespeichert — keine secrets.h mehr nötig.
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
src_dir = zaehler-esp32

[env:esp32dev]
; Core-Wechsel für W5500-LAN (FW 1.6.0): pioarduino bringt Arduino-Core 3.3.9 /
; ESP-IDF 5.5.4 — nur dort exponiert der ETH-Wrapper W5500-über-SPI. Der alte
; Standard-Core 2.0.17 (espressif32) kennt nur RMII-PHYs. Zum Zurückschalten die
; espressif32-Zeile aktivieren und die pioarduino-Zeile auskommentieren.
; Version gepinnt (nicht .git-HEAD) für reproduzierbare Builds — auch die CI
; (release.yml) muss auf dieselbe Plattform gestellt werden.
; platform = espressif32@^6.9.0   ; Rueckfall Core 2.0.17 (Stand v1.5.0) - Pin noetig, sonst zieht PIO 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
; Core 3.x/IDF5 macht die Binary deutlich größer (71 %->92 % im Default-1,25-MB-Slot).
; min_spiffs gibt ~1,9 MB je App-Slot (OTA bleibt zweislot-fähig); das Gerät nutzt nur
; NVS, kein SPIFFS/LittleFS -> die kleine Datenpartition stört nicht.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    ESP32Async/AsyncTCP@^3.4.0
    ESP32Async/ESPAsyncWebServer@^3.7.0

; OTA-Upload (nach dem ersten USB-Flash): Zeilen aktivieren und IP eintragen.
; upload_protocol = espota
; upload_port     = 192.168.178.217
